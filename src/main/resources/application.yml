spring:
  application:
    name: tayjava-spring-boot-lab
  data:
    web:
      pageable:
        max-page-size: 50
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tayjava}
    username: ${DB_USERNAME:tayjava}
    password: ${DB_PASSWORD:tayjava}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: tayjava-spring-boot-lab
    description: Course and Enrollment API

logging:
  level:
    root: INFO
    com.tayjava: INFO
    org.hibernate.SQL: debug

tayjava:
  seed:
    enabled: false
