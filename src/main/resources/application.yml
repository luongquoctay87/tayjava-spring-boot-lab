spring:
  application:
    name: tayjava-spring-boot-lab
  data:
    web:
      pageable:
        max-page-size: 50
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tayjava}
    username: ${DB_USERNAME:tayjava}
    password: ${DB_PASSWORD:tayjava}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: tayjava-spring-boot-lab
    description: Course and Enrollment API

logging:
  level:
    root: INFO
    com.tayjava: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{ISO8601} %-5level [%thread] [%X{requestId}] %logger{36} - %msg%n"

tayjava:
  seed:
    enabled: false
  coupon:
    base-url: ${COUPON_BASE_URL:http://127.0.0.1:9}
