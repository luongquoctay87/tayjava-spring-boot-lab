spring:
  application:
    name: tayjava-spring-boot-lab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tayjava}
    username: ${DB_USERNAME:tayjava}
    password: ${DB_PASSWORD:tayjava}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

server:
  port: 8080

logging:
  level:
    root: INFO
    com.tayjava: INFO
    org.hibernate.SQL: debug

tayjava:
  hello:
    message: "Hello from tayjava-spring-boot-lab"
  seed:
    enabled: false

elearning:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
